#
# CI of Amark (CIWorkflow; requirements 1.1, 5.1-5.5, 7.7): every push to the
# default branch and every pull request is configured, built and tested on every
# target environment, with AddressSanitizer and UndefinedBehaviorSanitizer, and
# with a short run of every fuzz target.
#
#   build       Linux (GCC, Clang), macOS (AppleClang), Windows (MSVC with the
#               Visual Studio generator, MSYS2 UCRT64 MinGW-w64 GCC), each with
#               BUILD_SHARED_LIBS OFF and ON; Linux GCC also in Release. All the
#               tests run, the package consumption tests (label "package")
#               included.
#   sanitizers  Linux Clang and GCC, Debug, AMARK_SANITIZE="address;undefined",
#               all the tests.
#   fuzz        Linux Clang, a fuzz-only configuration (AMARK_FUZZ=ON,
#               AMARK_BUILD_TESTS=OFF, so Naos must not be needed) with the
#               sanitizers, running the amark_fuzz_smoke target.
#
# Warnings are errors: Amark is the top-level project here, so
# AMARK_WARNINGS_AS_ERRORS is on by default; no job turns it off.
#
# Extension point (Downstream Extension Points): every configure step passes
# $AMARK_CI_CONFIGURE_ARGS (below) to CMake, unquoted, so later specs add
# configure options for all the jobs there (for example
# -DAMARK_REQUIRE_SPEC_TESTS=ON). This spec defines no such option.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Configure options added to every job (see the extension point above).
  AMARK_CI_CONFIGURE_ARGS: ""

jobs:
  build:
    name: build (${{ matrix.config.name }}, shared=${{ matrix.shared }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        shared: ["OFF", "ON"]
        config:
          - name: linux-gcc-debug
            os: ubuntu-24.04
            cc: gcc
            generator: Ninja
            build_type: Debug
            shell: bash
          - name: linux-gcc-release
            os: ubuntu-24.04
            cc: gcc
            generator: Ninja
            build_type: Release
            shell: bash
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang
            generator: Ninja
            build_type: Debug
            shell: bash
          - name: macos-clang
            os: macos-latest
            cc: clang
            generator: Ninja
            build_type: Debug
            shell: bash
          # The default generator of CMake on Windows is Visual Studio (MSVC).
          - name: windows-msvc
            os: windows-latest
            cc: ""
            generator: ""
            build_type: Debug
            shell: bash
          - name: windows-mingw
            os: windows-latest
            cc: gcc
            generator: Ninja
            build_type: Debug
            shell: msys2 {0}
            msys2: true
    defaults:
      run:
        shell: ${{ matrix.config.shell }}
    steps:
      - uses: actions/checkout@v5

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkgconf

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf

      - name: Set up MSYS2 UCRT64
        if: matrix.config.msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure
        env:
          AMARK_CC: ${{ matrix.config.cc }}
          AMARK_GENERATOR: ${{ matrix.config.generator }}
        run: |
          args=()
          if [ -n "$AMARK_GENERATOR" ]; then args+=(-G "$AMARK_GENERATOR"); fi
          if [ -n "$AMARK_CC" ]; then args+=("-DCMAKE_C_COMPILER=$AMARK_CC"); fi
          cmake -S . -B build "${args[@]}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            $AMARK_CI_CONFIGURE_ARGS

      - name: Build
        run: cmake --build build --config ${{ matrix.config.build_type }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config.build_type }} --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-build-${{ matrix.config.name }}-shared-${{ matrix.shared }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  sanitizers:
    name: sanitizers (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [clang, gcc]
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkgconf
          if [ "${{ matrix.cc }}" = clang ]; then
            # The sanitizer runtimes of the runner's default clang (compiler-rt).
            major=$(clang -dumpversion | cut -d. -f1)
            sudo apt-get install -y "libclang-rt-${major}-dev"
          fi

      # AddressSanitizer of older toolchains fails at start-up with the large
      # mmap randomization of recent kernels.
      - name: Limit mmap randomization
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DAMARK_SANITIZE=address;undefined" \
            $AMARK_CI_CONFIGURE_ARGS

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-sanitizers-${{ matrix.cc }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  fuzz:
    name: fuzz (clang)
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          # libFuzzer and the sanitizer runtimes of the runner's default clang.
          major=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libclang-rt-${major}-dev"

      - name: Limit mmap randomization
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # A fuzz-only configuration: the tests are off, so Naos must be neither
      # needed nor fetched (7.7). FetchContent is disconnected, so a dependency on
      # Naos fails the configuration.
      - name: Configure (fuzz only)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAMARK_FUZZ=ON \
            -DAMARK_BUILD_TESTS=OFF \
            "-DAMARK_SANITIZE=address;undefined" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            $AMARK_CI_CONFIGURE_ARGS

      - name: Check the fuzz-only configuration
        run: |
          if [ -e build/_deps/naos-src ]; then
            echo "::error::Naos was fetched in the fuzz-only configuration"
            exit 1
          fi
          if ! grep -q '^AMARK_HAVE_LIBFUZZER:INTERNAL=1$' build/CMakeCache.txt; then
            echo "::error::libFuzzer was not detected; the fuzz smoke run needs it"
            exit 1
          fi

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run the fuzz targets
        run: cmake --build build --target amark_fuzz_smoke

      - name: Upload fuzz crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-inputs
          path: |
            build/fuzz_smoke/*/crash-*
            build/fuzz_smoke/*/leak-*
            build/fuzz_smoke/*/timeout-*
            build/fuzz_smoke/*/oom-*
            build/fuzz_smoke/*/slow-unit-*
          if-no-files-found: ignore
